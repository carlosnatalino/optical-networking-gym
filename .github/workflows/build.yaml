name: Python package

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Build Cython extensions in place
        run: uv run python setup.py build_ext --inplace
      - name: Smoke test (quickstart example)
        run: uv run python examples/quickstart/basic_first_fit.py
      - name: Smoke test (topology script)
        run: uv run python examples/create_topology.py --topology nsfnet_chen -k 5
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Tests and coverage
        run: |
          uv run coverage run -m pytest
          uv run coverage report -m
